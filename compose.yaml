services:
  habit_tracker_db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    restart: always
    shm_size: 128mb
    volumes:
      - habit_tracker:/var/lib/postgresql/data
    ports:
      - ${DB_PORT:-5433}:5432

  adminer:
    image: adminer
    restart: always
    ports:
      - ${ADMINER_PORT:-8081}:8080

volumes:
  habit_tracker:
